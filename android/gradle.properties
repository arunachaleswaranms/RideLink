# RideLink Android build properties.
# JDK 21 is pinned explicitly rather than inherited from JAVA_HOME/PATH, because this machine's
# default `java` is Temurin 25 (see docs/DECISIONS/ADR-011-platform-baselines.md, Amendment A1).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Without an explicit heap, the Gradle daemon falls back to a small default (observed as 512 MiB
# heap / 384 MiB metaspace on GitHub Actions' ubuntu-latest runner) that is enough for the JVM
# unit-test tasks but not for `lint`, whose AndroidLint analysis (ApiDetector's resource-folder
# scan in particular) runs in-process in the daemon (NoIsolationWorkerFactory) rather than a
# separate worker process — an OutOfMemoryError there crashed CI run 33033917411's `android` job
# while every local run (larger default heap) passed. Raised generously above what a five-module
# build plus lint actually needs, with headroom for a shared CI runner.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
