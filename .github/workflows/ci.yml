name: CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: core unit tests
        run: ./gradlew :core:test

      - name: all unit tests
        run: ./gradlew test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: lint
        run: ./gradlew lint

      - name: assembleDebug
        run: ./gradlew assembleDebug

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version

      - name: RideLinkCore tests
        run: swift test --package-path ios/Packages/RideLinkCore

      - name: RideLinkPlatform tests
        run: swift test --package-path ios/Packages/RideLinkPlatform

      - name: Build unsigned simulator target
        run: |
          xcodebuild \
            -project ios/RideLink.xcodeproj \
            -scheme RideLink \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
