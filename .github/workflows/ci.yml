name: CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          # Every run otherwise re-downloads AGP, Compose, Media3 and the ~48 MB WebRTC AAR. The
          # key covers the version catalog explicitly: setup-java's default pattern looks for
          # gradle/*.versions.toml at the repository root, and this one lives under android/.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action defaults to legacy `tools`, which the SDK repository no longer supplies.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: core unit tests
        run: ./gradlew :core:test

      - name: all unit tests
        run: ./gradlew test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: lint
        run: ./gradlew lint

      - name: assembleDebug
        run: ./gradlew assembleDebug

      # NFR-06 / PROTOCOL §1: production control traffic is TLS 1.3 and there is no plaintext
      # fallback. Phase 1b enforces that structurally — the plaintext channel lives only in
      # `network/src/test`, so it is not compiled into the library at all — and
      # `PlaintextTransportAbsenceTest` (run by the unit-test step above) fails if a raw socket
      # ever reappears in production sources. A release build succeeding is the second half of
      # that: it proves the app assembles with no plaintext transport available to it.
      - name: assembleRelease
        run: ./gradlew assembleRelease

      # A CI-only test failure is useless if its report cannot be read afterwards. Phase 2a hit a
      # failure that reproduced on no local run, and the console log carried the assertion's location
      # without its message. Uploading the XML/HTML reports on failure makes the next one diagnosable
      # instead of guessable. `if: failure()` only — this uploads nothing on a green run.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            android/*/build/reports/tests/
            android/*/build/test-results/
          retention-days: 14

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version

      - name: RideLinkCore tests
        run: swift test --package-path ios/Packages/RideLinkCore

      - name: RideLinkPlatform tests
        run: swift test --package-path ios/Packages/RideLinkPlatform

      - name: Build unsigned Debug simulator target
        run: |
          xcodebuild \
            -project ios/RideLink.xcodeproj \
            -scheme RideLink \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # As on Android: the plaintext channel is a fixture in RideLinkPlatform's *test target*, so
      # it cannot be linked into the app in any configuration. A Release build succeeding proves
      # the app assembles against the TLS channel alone.
      - name: Build unsigned Release simulator target
        run: |
          xcodebuild \
            -project ios/RideLink.xcodeproj \
            -scheme RideLink \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
